<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta-name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invision Health Care - Coming Soon</title>
    <style>
        body {
            background: linear-gradient(135deg, #0a2342, #2ca58d);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(10, 35, 66, 0.85);
            padding: 40px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            max-width: 400px;
            width: 90%;
        }
        .logo {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .tagline {
            font-size: 1.25em;
            color: #b6eada;
            margin-bottom: 30px;
        }
        .soon {
            font-size: 2em;
            margin-bottom: 12px;
            color: #2ca58d;
        }
        .desc {
            font-size: 1em;
            margin-bottom: 24px;
        }
        .subscribe {
            margin-top: 14px;
        }
        input, button {
            padding: 9px 12px;
            border-radius: 5px;
            border: none;
            margin: 2px 0;
            outline: none;
        }
        input[type="email"] {
            width: 62%;
        }
        button {
            background: #2ca58d;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #247463;
        }
        .footer {
            margin-top: 28px;
            font-size: 0.93em;
            color: #b6eada;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Invision Health Care</div>
        <div class="tagline">Empowering Better Health, Coming Soon!</div>
        <div class="soon">We're Launching Soon</div>
        <div class="desc">
            Our website is under construction. <br>
            Stay tuned for updates and be the first to know when we go live!
        </div>
        <form class="subscribe">
            <input type="email" placeholder="Your Email" required>
            <button type="submit">Notify Me</button>
        </form>
        <div class="footer">
            &copy; 2025 Invision Health Care. All rights reserved.
        </div>
    </div>
</body>
</html>
